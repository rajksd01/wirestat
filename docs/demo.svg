<svg xmlns="http://www.w3.org/2000/svg" width="716" height="452" viewBox="0 0 716 452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14"><rect width="716" height="452" rx="10" fill="#121214"/><rect width="716" height="34" rx="10" fill="#0e0e10"/><rect y="24" width="716" height="10" fill="#0e0e10"/><circle cx="22" cy="17" r="5.5" fill="#d75f5f"/><circle cx="42" cy="17" r="5.5" fill="#c8a45c"/><circle cx="62" cy="17" r="5.5" fill="#5f875f"/><text><tspan x="22.0" y="72.5" fill="#e8834a" xml:space="preserve">$ </tspan><tspan x="38.8" y="72.5" fill="#c9c5be" xml:space="preserve">curl -s -o /dev/null https://example.com</tspan><tspan x="22.0" y="94.5" fill="#5f875f" xml:space="preserve">200</tspan><tspan x="47.2" y="94.5" fill="#767680" xml:space="preserve">  h2   new   dns 13  tcp 9  tls 13  srv 14  dl 0</tspan><tspan x="450.4" y="94.5" fill="#ff875f" xml:space="preserve">   49ms</tspan><tspan x="509.2" y="94.5" fill="#767680" xml:space="preserve">  559B</tspan><tspan x="22.0" y="138.5" fill="#e8834a" xml:space="preserve">$ </tspan><tspan x="38.8" y="138.5" fill="#c9c5be" xml:space="preserve">curl -s -o /dev/null -o /dev/null https://example.com https://example.com</tspan><tspan x="22.0" y="160.5" fill="#5f875f" xml:space="preserve">200</tspan><tspan x="47.2" y="160.5" fill="#767680" xml:space="preserve">  h2   new   dns 2  tcp 8  tls 13  srv 18  dl 0</tspan><tspan x="442.0" y="160.5" fill="#ff875f" xml:space="preserve">   41ms</tspan><tspan x="500.8" y="160.5" fill="#767680" xml:space="preserve">  559B</tspan><tspan x="22.0" y="182.5" fill="#5f875f" xml:space="preserve">200</tspan><tspan x="47.2" y="182.5" fill="#767680" xml:space="preserve">  h2   reuse dns 0  tcp 0  tls 0  srv 10  dl 3</tspan><tspan x="433.6" y="182.5" fill="#ff875f" xml:space="preserve">   13ms</tspan><tspan x="492.4" y="182.5" fill="#767680" xml:space="preserve">  559B</tspan><tspan x="22.0" y="204.5" fill="#6b6b73" xml:space="preserve"># same connection reused: no dns, no tcp, no tls</tspan><tspan x="22.0" y="248.5" fill="#e8834a" xml:space="preserve">$ </tspan><tspan x="38.8" y="248.5" fill="#c9c5be" xml:space="preserve">curl -sL -o /dev/null http://github.com</tspan><tspan x="22.0" y="270.5" fill="#5f875f" xml:space="preserve">200</tspan><tspan x="47.2" y="270.5" fill="#767680" xml:space="preserve">  h2   new   dns 16  tcp 67  tls 0  srv 130  dl 171  redir 6</tspan><tspan x="551.2" y="270.5" fill="#ff875f" xml:space="preserve">   390ms</tspan><tspan x="618.4" y="270.5" fill="#767680" xml:space="preserve">  561.1KB</tspan><tspan x="22.0" y="314.5" fill="#e8834a" xml:space="preserve">$ </tspan><tspan x="38.8" y="314.5" fill="#c9c5be" xml:space="preserve">curl -s -o /dev/null https://httpbin.org/status/503</tspan><tspan x="22.0" y="336.5" fill="#d75f5f" xml:space="preserve">503</tspan><tspan x="47.2" y="336.5" fill="#767680" xml:space="preserve">  h2   new   dns 30  tcp 286  tls 534  srv 796  dl 0</tspan><tspan x="484.0" y="336.5" fill="#ff875f" xml:space="preserve">   1646ms</tspan><tspan x="559.6" y="336.5" fill="#767680" xml:space="preserve">  0B</tspan><tspan x="22.0" y="358.5" fill="#6b6b73" xml:space="preserve"># 1.6s, and 820ms of it never reached the app</tspan><tspan x="22.0" y="402.5" fill="#e8834a" xml:space="preserve">$ </tspan><tspan x="38.8" y="402.5" fill="#c9c5be" xml:space="preserve">curl -s -o /dev/null https://nope.invalid</tspan><tspan x="22.0" y="424.5" fill="#d75f5f" xml:space="preserve">err</tspan><tspan x="47.2" y="424.5" fill="#767680" xml:space="preserve">  curl: (6) Could not resolve host: nope.invalid</tspan></text></svg>